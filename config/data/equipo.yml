      Abogada y Licenciada en Ciencias Jurídicas y Sociales por la Universidad de Chile. Magíster en Derecho del Trabajo y de la Seguridad Social por la Universidad de Talca y por la Universidad de Valencia (España). Profesora de Derecho del Trabajo en programas de postgrado. Experiencia en asesoría y litigación laboral. En los primeros años de su trayectoria profesional se especializó en el desarrollo de información jurídica electrónica, siendo fundadora y copartícipe de la Base de Datos del Diario Oficial (1995), primer medio electrónico legal en Chile, y ex directora editorial de publicaciones especializadas en Derecho del Trabajo.
